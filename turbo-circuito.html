<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Turbo Circuito 3D</title>
<style>
:root{--bg:#0c0f14;--fg:#fff;--sa:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;pointer-events:none;display:none}
.scr.on{display:block}
#zone{position:fixed;inset:0;display:none;touch-action:none}
#zone.on{display:block}
#joy{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.75)}
#ghost{position:fixed;left:calc(34px + var(--sl));bottom:calc(60px + var(--sa));width:112px;height:112px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);display:none;pointer-events:none;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.7);text-align:center}
#ghost.on{display:flex}
#card{position:absolute;left:12px;right:12px;top:calc(10px + var(--st));max-width:340px;background:rgba(10,12,18,.72);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);display:none}
#card.on{display:block}
#card b{font-size:17px}#card span{font-size:12px;color:#c4c8d2;margin-left:6px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px;font-size:11px;color:#c4c8d2}
.st div{display:flex;align-items:center;gap:6px}.st u{display:block;height:6px;border-radius:3px;background:#ffd23f;text-decoration:none}.st s{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18);display:block}
#hint{position:absolute;left:0;right:0;top:calc(10px + var(--st));text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 3px #000;padding:0 16px}

.big{pointer-events:auto;position:absolute;border:0;border-radius:18px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit}

#board.on{display:block}
#top{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--st)) 10px 8px;display:flex;justify-content:space-between;gap:6px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
#top div{text-align:center;min-width:60px}#top small{display:block;font-size:10px;color:#cfd3dc;letter-spacing:.5px}#top b{font-size:20px}

#bars div{display:flex;align-items:center;gap:6px}#bars i{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden}#bars u{display:block;height:100%;width:100%;background:#22c55e;text-decoration:none}
#boxb{right:calc(10px + var(--sr));top:calc(58px + var(--st));width:70px;height:40px;font-size:17px;background:rgba(20,22,28,.78);border:2px solid rgba(255,255,255,.35)}
#boxb.q{background:#ff9500;border-color:#fff}
#boxb.warn{background:#ef4444;animation:bl .5s infinite alternate}
@keyframes bl{to{background:#7a1d1d}}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:30px;font-weight:900;text-shadow:0 3px 8px #000;padding:0 10px}

#wheelin{position:absolute;inset:0;will-change:transform}

.ped.down{transform:translateY(6px);box-shadow:0 0 0 rgba(0,0,0,.45)}.ped.down em{opacity:1}
#gas{right:calc(14px + var(--sr));bottom:calc(20px + var(--sa));width:88px;height:140px;background:linear-gradient(#34d27a,#16a34a)}
#brake{right:calc(116px + var(--sr));bottom:calc(20px + var(--sa));width:74px;height:96px;background:linear-gradient(#f26a6a,#c62828)}
#res{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;pointer-events:auto}

#res .big2{font-size:64px;line-height:1}#res h2{margin:8px 0 4px;font-size:26px}#res p{margin:4px 0;color:#d6d9e0}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:18px;z-index:9;transition:opacity .4s}
</style>

</head>

  <div id="msg"></div>
  <div id="lights"><i></i><i></i><i></i></div>
  <div id="wheel"><div id="wheelin">

    <span id="whand">👆</span></div></div>
  <div id="brake" class="ped">FRENO<em>👆</em></div>
  <div id="gas" class="ped">GAS<em>👆</em></div>
</div>
<div id="res"><div class="box"><div class="big2" id="rmed">🏁</div><h2 id="rpos"></h2><p id="rtime"></p><p id="rbest"></p><button id="rbtn" class="big">Volver al paddock</button></div></div>
<div id="fade"></div>

{const g=new THREE.SphereGeometry(2800,24,14),pa=g.attributes.position,cols=[];const a=new THREE.Color(0xdff0ff),b=new THREE.Color(0x3f8ee0),c=new THREE.Color();

{const t=ctex(128,128,(x,w,h)=>{x.fillStyle='#437f3c';x.fillRect(0,0,w,h);for(let i=0;i<500;i++){x.fillStyle=Math.random()>.5?'rgba(80,140,64,.5)':'rgba(40,96,40,.45)';x.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*3,2+Math.random()*3)}});
 t.repeat.set(420,420);const m=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.MeshStandardMaterial({map:t,roughness:1}));m.rotation.x=-Math.PI/2;m.position.set(150,0,-100);m.receiveShadow=true;scene.add(m)}

/* ================= Datos del circuito ================= */
const HW=7,DS=4;
const CMD=[['S',700],['A',50,140],['A',40,70],['S',90],['A',90,75],['S',120],['A',-35,110],['A',35,110],['S',90],['A',45,90],['A',-45,90],['S','R'],['A',90,75],['S','B'],['A',90,75]];
function gen(R,B){const pts=[[0,-480]];let x=0,z=-480,ph=0;

const pts0=raw.slice(0,n0-1).map((p,i)=>[p[0]-ee[0]*i/(n0-1),p[1]-(ee[1]+480)*i/(n0-1)]);

 for(let i=0;i<N;i++){const a=(i+N-1)%N,b=(i+1)%N;let tx=PX[b]-PX[a],tz=PZ[b]-PZ[a];const m=Math.hypot(tx,tz);TX[i]=tx/m;TZ[i]=tz/m;ang[i]=Math.atan2(TX[i],TZ[i])}
 const kk=new Float32Array(N);for(let i=0;i<N;i++){const a=(i+N-1)%N,b=(i+1)%N;kk[i]=-(mod(ang[b]-ang[a]+Math.PI,TAU)-Math.PI)/(2*ds)}
 for(let i=0;i<N;i++){let s=0;for(let q=-2;q<=2;q++)s+=kk[(i+q+N)%N];K[i]=s/5}}

 let tx=TX[i]+(TX[j]-TX[i])*u,tz=TZ[i]+(TZ[j]-TZ[i])*u;const m=Math.hypot(tx,tz)||1;o.tx=tx/m;o.tz=tz/m;o.nx=-o.tz;o.nz=o.tx;o.k=K[i]+(K[j]-K[i])*u;return o}

{ /* barreras */

 /* pacas */

 else{PERS.g.visible=false;car.helm.visible=true;car.g.position.y=GY+Math.sin(T*60)*.012;if(t>2.5){car.g.position.y=GY;beginLeaving()}}
 const cx=car.g.position.x,cz=car.g.position.z;camPos.set(cx+Math.sin(camYaw)*Math.cos(.45)*13,1.4+Math.sin(.45)*13,cz+Math.cos(camYaw)*Math.cos(.45)*13);camera.position.lerp(camPos,1-Math.exp(-dt*5));camLook.set(cx,1,cz);camera.lookAt(camLook)}
function updateLeaving(dt){leave.v=Math.min(10.5,leave.v+5*dt);leave.u=Math.min(1,leave.u+leave.v*dt/leave.len);const p=leave.curve.getPointAt(leave.u),tg=leave.curve.getTangentAt(leave.u),g=P.car.g;
 g.position.set(p.x,GY-.01,p.z);P.yaw=angLerp(P.yaw,Math.atan2(tg.x,tg.z),Math.min(1,dt*10));g.rotation.y=P.yaw;spinWheels(P.car,leave.v,0,dt);introCam(dt);
 if(leave.u>=1){P.dist=p.z;P.d=PIT_D;P.v=leave.v;P.dd=0;P.yaw=0;mode='grid'}}
function updateGrid(dt){const rem=GRID_P-P.dist,tv=Math.min(14,Math.sqrt(2*8*Math.max(0,rem))),td=lerp(PIT_D,2.6,sstep((P.dist+135)/45));
 autoDrive(P,dt,rem<.3?0:Math.max(tv,rem>1?3:0),td,10,18);advance(P,dt);
 placeCar(P,dt);spinWheels(P.car,P.v,0,dt);introCam(dt);
 if(rem<.5&&P.v<.6&&Math.abs(P.d-2.6)<.5){P.v=0;P.dist=GRID_P;P.d=2.6;mode='count';cdT=3.6;raceT=0;$('lights').classList.add('on')}}
function introCam(dt){const g=P.car.g,fx=Math.sin(P.yaw),fz=Math.cos(P.yaw);tmpV.set(g.position.x-fx*9+3,3.6,g.position.z-fz*9);camera.position.lerp(tmpV,1-Math.exp(-dt*3));camLook.set(g.position.x+fx*8,1.1,g.position.z+fz*8);camera.lookAt(camLook);camera.fov=62;camera.updateProjectionMatrix()}
function updateRace(dt){
 if(mode==='count'){cdT-=dt;const n=cdT>2.7?0:cdT>1.8?1:cdT>.9?2:3;[...$('lights').children].forEach((e,i)=>e.className=i<n?'r':'');
  if(cdT<=0){mode='race';raceT=0;$('lights').classList.remove('on');say('¡YA!',1.1);[...$('lights').children].forEach(e=>e.className='')}}
 if(mode==='race'||mode==='pitin'||mode==='pitstop'||mode==='pitout'||mode==='finish')raceT+=dt;
 if(mode==='race'){playerPhys(dt);
  if(pitReq){const dl=mod(PIT_Z0-zl(),L);if(dl<230&&dl>1){startPit()}}
  if(P.dist>=LAPS*L){mode='finish';fin={t:0,rank:rank(),time:raceT};if(!bestT||raceT<bestT){bestT=raceT;try{localStorage.setItem('tc3d_best',bestT)}catch(e){}}say('¡META!',2)}}
 else if(mode==='pitin'||mode==='pitstop'||mode==='pitout')updPit(dt);
 else if(mode==='finish'){fin.t+=dt;autoDrive(P,dt,0,0,0,9);P.car.tail.emissiveIntensity=2;advance(P,dt);
  if(fin.t>2.2&&!$('res').classList.contains('on')){const r=fin.rank;$('rmed').textContent=r===1?'🥇':r===2?'🥈':r===3?'🥉':'🏁';$('rpos').textContent='Posición '+r+' de 8';$('rtime').textContent='Tu tiempo: '+fmt(fin.time);$('rbest').textContent='Mejor tiempo: '+fmt(bestT);show('res',true)}}
 updRivals(dt);
 placeCar(P,dt);spinWheels(P.car,P.v,P.steer||0,dt);rivals.forEach(r=>{placeCar(r,dt);spinWheels(r.car,r.v,r.dd*.05,dt)});
 if(mode==='count')P.car.tail.emissiveIntensity=.8;
 /* cámara */
 const g=P.car.g,fx=Math.sin(P.yaw),fz=Math.cos(P.yaw),sp=P.v;
 const back=8.6+sp*.05,hgt=3.2+sp*.012;tmpV.set(g.position.x-fx*back,hgt,g.position.z-fz*back);
 camera.position.lerp(tmpV,1-Math.exp(-dt*(mode==='count'?3:6)));
 camLook.set(g.position.x+fx*12,1.3,g.position.z+fz*12);camera.lookAt(camLook);
 if(shake>0){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake*.7;shake=Math.max(0,shake-dt*1.5)}
 camera.fov=lerp(camera.fov,60+Math.min(sp,80)*.3,Math.min(1,dt*3));camera.updateProjectionMatrix();
 /* HUD */
 const rk=mode==='finish'?fin.rank:rank(),lap=clamp(Math.floor(Math.max(0,P.dist)/L)+1,1,LAPS);
 $('hpos').textContent=rk+'/8';$('hlap').textContent=lap+'/'+LAPS;$('htime').textContent=fmt(raceT);$('hspd').textContent=Math.round(P.v*3.6);
 const bf=$('bf'),bt=$('bt');bf.style.width=P.fuel+'%';bt.style.width=P.tire+'%';bf.style.background=P.fuel<25?'#ef4444':'#22c55e';bt.style.background=P.tire<25?'#ef4444':'#fbbf24';
 const low=(P.fuel<25||P.tire<25)&&mode==='race',bx=$('boxb');bx.className='big'+(pitReq||mode.startsWith('pit')?' q':low?' warn':'');
 if(low&&!pitReq&&msgT<=0)say('Pocas llantas o gasolina · toca BOX',.2);
}
/* volante: gira con el dedo y regresa solo al soltarlo */
function updWheel(dt){if(wid===null)wang=lerp(wang,0,Math.min(1,dt*9));IN.st=clamp(wang/.9,-1,1);wheelIn.style.transform='rotate('+(wang*57.3)+'deg)'}

let last=performance.now(),frameN=0;
function frame(now){
 const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;frameN++;
 if(mode==='paddock')updatePaddock(dt);else if(mode==='boarding')updateBoarding(dt);else if(mode==='leaving')updateLeaving(dt);else if(mode==='grid')updateGrid(dt);else updateRace(dt);
 if(mode==='race'||mode==='count'||mode==='grid'||mode.startsWith('pit')||mode==='finish')updWheel(dt);
 if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
 /* animaciones ambiente */
 workers.forEach(w=>pose(w.p,w.m,T+w.ph,0));
 if(mode!=='pitstop'&&mode!=='pitout')crew.forEach(c=>pose(c.p,'idle',T+c.ph,0));
 clouds.forEach(c=>{c.position.x+=dt*4;if(c.position.x>1000)c.position.x=-800});
 if(frameN%2===0)crowdUpdate(T);
 sky.position.copy(camera.position);
 const fp=mode==='paddock'||mode==='boarding'?camLook:P?P.car.g.position:camLook;sun.position.set(fp.x+110,200,fp.z+80);sun.target.position.set(fp.x,0,fp.z);sun.target.updateMatrixWorld();
 renderer.render(scene,camera);requestAnimationFrame(frame)}
/* arranque */
gridPlace();camera.position.set(pl.x+9,6,pl.z+7);
$('load').style.opacity=0;setTimeout(()=>$('load').style.display='none',500);
show('padui',true);show('zone',true);$('ghost').classList.add('on');
requestAnimationFrame(frame);
})();
